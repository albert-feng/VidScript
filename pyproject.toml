[project]
name = "vidscript"
version = "1.0.0"
description = "VidScript: 一个用于下载视频、提取音频并利用大模型生成/润色讲稿的桌面应用程序。"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "customtkinter>=5.2.2",
    "yt-dlp>=2026.1.31",
    "requests>=2.32.5",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "nuitka>=2.8.10",
    "flake8>=7.3.0",
    "playwright>=1.58.0",
    "dashscope>=1.25.10",
    "openai>=2.16.0",
    "dotenv>=0.9.9",
    "oss2>=2.19.1",
    "pyyaml>=6.0.2",
]
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
vidscript = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "main.py"]

[tool.uv]
dev-dependencies = [
    "flake8>=7.3.0",
    "pyinstaller>=6.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
